<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Calculadora de Resistencias</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-contacto.css">
</head>

<body>
  <nav>
    <ul>
      <li><a href="index.html">Calculadora</a></li>
      <li><a href="https://www.yoigoluzygas.com/blog/como-funciona-una-resistencia-electrica-tipos-y-usos/">Teoría</a></li>
      <li><a href="contacto.html" class="active">Contacto</a></li>
    </ul>
  </nav>

  <div class="contacto-container">
    <h2>Contáctanos</h2>
    <p>¿Tienes dudas, sugerencias o comentarios? Rellena el formulario y te responderemos lo antes posible.</p>

    <form>
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>

      <button type="submit">Enviar Mensaje</button>
    </form>
  </div>

  <footer>
    <div class="footer-container">
      <p>&copy; 2025 Calculadora de Resistencias | Todos los derechos reservados</p>
      <div class="footer-links">
        <a href="#">Política de Privacidad</a>
        <a href="#">Términos de Servicio</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </div>
  </footer>
</body>
</html>
